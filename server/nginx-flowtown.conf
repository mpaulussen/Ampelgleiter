# In den bestehenden server { ... }-Block der songdeepdive-Domain (Port 443) einfügen.
# Die App erreicht den Server dann unter https://<deine-domain>/flowtown-api
location /flowtown-api/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    client_max_body_size 128k;
}
